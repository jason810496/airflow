#
# Builds, signs and uploads a language SDK source release candidate to a draft on Apache
# Trusted Releases (ATR). Setup and the release flow: dev/README_RELEASE_LANG_SDK_ATR.md.
#
# Only the per-SDK callers (java-sdk-atr-compose.yml, ...) are dispatched. ATR picks the project
# from the OIDC token's workflow path, which is the caller's, and refuses a path registered in
# more than one project, so each SDK needs its own caller registered in its own ATR project.
---
name: Compose language SDK release on ATR
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      sdk:
        description: "SDK to release: java, ts or go"
        required: true
        type: string
    secrets:
      signing-key:
        description: "ASCII-armored private key of the committee's Automated Release Signing key"
        required: true

permissions:
  contents: read

env:
  # Primary fingerprint of the committee's Automated Release Signing key, set once ASF Infra
  # provisions it. Signing fails while it is empty, and if the secret holds any other key.
  SIGNING_KEY_FINGERPRINT: ""

jobs:
  build:
    name: Build source release
    runs-on: ubuntu-latest
    # A re-run executes with the privileges of the original actor, so it must be that actor.
    if: >-
      github.triggering_actor == github.actor &&
      contains(fromJSON('[
        "ashb",
        "bugraoz93",
        "eladkal",
        "ephraimbuddy",
        "hussein-awala",
        "jason810496",
        "jedcunningham",
        "jscheffl",
        "kaxil",
        "o-nikolas",
        "pierrejeambrun",
        "shahar1",
        "potiuk",
        "uranusjr",
        "vincbeck",
        "vatsrahul1001"
      ]'), github.actor)
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      commit: ${{ steps.build.outputs.commit }}
      tarball: ${{ steps.build.outputs.tarball }}
      sha512: ${{ steps.build.outputs.sha512 }}
    steps:
      - name: Require a dispatch on the release candidate tag
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" != "tag" ]]; then
            echo "::error::Dispatch this workflow on the release candidate tag (--ref), not ${REF}"
            exit 1
          fi
      - name: Checkout release candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the tag commit is on main or a release branch
        env:
          DISPATCH_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${DISPATCH_SHA}" = "$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$(git rev-parse HEAD)"
          # Cherry-picks onto a release branch get new SHAs, so containment in main alone is not enough.
          release_refs=$(git for-each-ref --format='%(refname)' refs/remotes/origin \
            | grep -E '^refs/remotes/origin/(main|v[0-9]+-[0-9]+-(test|stable))$' || true)
          contained_in=""
          for ref in ${release_refs}; do
            if git merge-base --is-ancestor HEAD "${ref}"; then
              contained_in="${ref}"
              break
            fi
          done
          if [[ -z "${contained_in}" ]]; then
            echo "::error::${TAG} is not on main or a vX-Y-test/vX-Y-stable branch"
            exit 1
          fi
          echo "Release commit is contained in ${contained_in}"
      - name: Build source tarball and checksum
        id: build
        env:
          SDK: ${{ inputs.sdk }}
          TAG: ${{ github.ref_name }}
        run: dev/lang_sdk_release/build_source_release.sh "${SDK}" "${TAG}" "${RUNNER_TEMP}/source-release"
      - name: Upload unsigned source release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.sdk }}-sdk-source-release
          path: ${{ runner.temp }}/source-release/
          if-no-files-found: error
          retention-days: 7

  # Holds the signing key but no OIDC permission, so a compromised step here cannot reach ATR.
  sign:
    name: Sign source release
    needs: build
    runs-on: ubuntu-latest
    if: github.triggering_actor == github.actor
    environment:
      name: lang-sdk-atr-compose
    permissions:
      contents: read
    steps:
      - name: Download unsigned source release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.sdk }}-sdk-source-release
          path: ${{ runner.temp }}/source-release
      - name: Verify the tarball is the one the build job produced
        working-directory: ${{ runner.temp }}/source-release
        env:
          EXPECTED_SHA512: ${{ needs.build.outputs.sha512 }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA512}  ${TARBALL}" | sha512sum --check --strict -
          sha512sum --check --strict "${TARBALL}.sha512"
      - name: Sign with the Automated Release Signing key
        working-directory: ${{ runner.temp }}/source-release
        env:
          SIGNING_KEY: ${{ secrets.signing-key }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY_FINGERPRINT}" ]]; then
            echo "::error::SIGNING_KEY_FINGERPRINT is not set in lang-sdk-atr-compose.yml"
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          trap 'gpgconf --kill all; rm -rf "${GNUPGHOME}"' EXIT
          printf '%s\n' "${SIGNING_KEY}" | gpg --batch --quiet --import
          gpg --batch --armor --detach-sign --local-user "${SIGNING_KEY_FINGERPRINT}!" \
            --output "${TARBALL}.asc" "${TARBALL}"
          gpg --batch --status-fd 1 --verify "${TARBALL}.asc" "${TARBALL}" \
            | grep -E "^\[GNUPG:\] VALIDSIG ([^ ]+ ){9}${SIGNING_KEY_FINGERPRINT}$"
      - name: Upload signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.sdk }}-sdk-source-release-signature
          path: ${{ runner.temp }}/source-release/${{ needs.build.outputs.tarball }}.asc
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload to ATR
    needs: [build, sign]
    runs-on: ubuntu-latest
    if: github.triggering_actor == github.actor
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download unsigned source release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.sdk }}-sdk-source-release
          path: ${{ runner.temp }}/atr-dist
      - name: Download signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.sdk }}-sdk-source-release-signature
          path: ${{ runner.temp }}/atr-dist
      - name: Verify the upload holds exactly the signed release
        working-directory: ${{ runner.temp }}/atr-dist
        env:
          EXPECTED_SHA512: ${{ needs.build.outputs.sha512 }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA512}  ${TARBALL}" | sha512sum --check --strict -
          expected="$(printf '%s\n' "${TARBALL}" "${TARBALL}.asc" "${TARBALL}.sha512" | LC_ALL=C sort)"
          actual="$(find . -type f -printf '%P\n' | LC_ALL=C sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Unexpected files to upload:"
            echo "${actual}"
            exit 1
          fi
      - name: Upload to ATR
        uses: apache/tooling-actions/upload-to-atr@43a38c48536aaf8f29c58aed22d7ac9f170eced7  # main
        with:
          project: airflow-${{ inputs.sdk }}-sdk
          version: ${{ needs.build.outputs.version }}
          src: ${{ runner.temp }}/atr-dist
          source-commit: ${{ needs.build.outputs.commit }}
