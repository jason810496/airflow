#
# Registered as the compose workflow of the airflow-go-sdk project on ATR. Dispatch it on the
# release candidate tag (go-sdk/v<VERSION>-rc<N>); see dev/README_RELEASE_LANG_SDK_ATR.md.
---
name: Compose Go SDK release on ATR
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-sdk-atr-compose
  cancel-in-progress: false

jobs:
  compose:
    name: Compose Go SDK release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/lang-sdk-atr-compose.yml
    with:
      sdk: go
    secrets:
      signing-key: ${{ secrets.AUTOMATED_RELEASE_SIGNING_KEY }}
