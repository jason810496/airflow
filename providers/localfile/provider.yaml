---

package-name: apache-airflow-providers-localfile
name: Local File
description: |
    Operators to create, write, check and delete files of the machine that runs the task. They are
    implemented in TypeScript, so a task runs on a worker of the TypeScript runtime.

state: ready
source-date-epoch: 0
lifecycle: incubation
versions:
  - 1.0.0

integrations:
  - integration-name: Local File
    external-doc-url: https://airflow.apache.org/docs/apache-airflow-providers-localfile/
    how-to-guide:
      - /docs/apache-airflow-providers-localfile/operators.rst
    tags: [software]

operators:
  - integration-name: Local File
    python-modules:
      - airflow.providers.localfile.operators.file
